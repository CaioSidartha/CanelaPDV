{
  "appId": "com.canela.store",
  "productName": "Canela",
  "copyright": "Copyright © Canela",
  "directories": {
    "output": "dist-electron"
  },
  "files": [
    "electron/**/*",
    "package.json"
  ],
  "extraResources": [
    {
      "from": ".next/standalone",
      "to": "standalone",
      "filter": ["**/*"]
    }
  ],
  "asarUnpack": [
    "**/standalone/**",
    "**/better-sqlite3/**",
    "**/node_modules/better-sqlite3/**"
  ],
  "win": {
    "target": [
      {
        "target": "nsis",
        "arch": ["x64"]
      }
    ]
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true,
    "createDesktopShortcut": true,
    "shortcutName": "Canela",
    "include": "electron/installer.nsh"
  }
}
